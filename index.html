text:()=>`<p><em>Lorian spielt drei Akkorde und nickt. Du holst Luft:</em></p><blockquote>„Der Winter kam, die Welt wird weiß,<br>Frostwinkel singt jetzt laut, nicht ___“</blockquote><p>Welches Wort passt?</p>`,
ch:()=>[
 {l:'„still“',to:'fb',fx:badm('Kein Reim','Es reimt sich nicht auf „weiß“. Lorian verzieht das Gesicht wie bei saurer Milch. „Noch mal. Mit Reim, bitte.“','r1')},
 {l:'„leis’“',to:'r2'},
 {l:'„Gebührenordnung“',to:'fb',fx:badm('Eine Drohung','Knöterich zuckt zusammen, als hätte jemand seinen Namen gesagt. Lorian flüstert: „Das ist keine Strophe, das ist eine Drohung.“','r1')}]},
r2:{place:'stage',t:'Strophe 2',
text:()=>`<p>Die erste Zeile sitzt. Im Saal rührt sich ein Fuß, der mitwippt. Lorian grinst und greift in die Saiten.</p><blockquote>„Wer einem andern die Stimme stiehlt,<br>hat nie ein richtiges Lied ___“</blockquote>`,
ch:()=>[
 {l:'„gesungen“',to:'fb',fx:badm('Fast!','Der Sinn stimmt, aber „gesungen“ reimt sich nicht auf „stiehlt“. Lorians Laute klingt, als würde sie die Stirn runzeln.','r2')},
 {l:'„Steuerbescheid“',to:'fb',fx:badm('Ein Bescheid','Im Saal lacht jemand, aber nicht freundlich. Knöterich nickt anerkennend. Das ist definitiv das falsche Publikum.','r2')},
 {l:'„gespielt“',to:'r3'}]},
r3:{place:'stage',t:'Strophe 3',
text:()=>`<p>Jetzt singt jemand leise mit. Dann zwei. Du spürst es: Das Lied hat eine Mitte gefunden.</p><blockquote>„Die Glocke läutet, kalt und klar,<br>wir singen frei, dies ganze ___“</blockquote>`,
ch:()=>[
 {l:'„Dorf“',to:'fb',fx:badm('Fast, aber …','„Dies ganze Dorf“ klingt schön, reimt sich aber nicht auf „klar“. Lorian presst die Lippen zusammen. „Noch einmal, Poet.“','r3')},
 {l:'„Jahr“',to:'song_result'},
 {l:'„Gebühr“',to:'fb',fx:badm('Gebühr','Der Saal stöhnt auf. „Gebühr“ reimt sich nicht auf „klar“ und auf nichts, das Menschen lieben.','r3')}]},
song_result:{place:'stage',t:'Das Lied erklingt',
text:()=>`<p>${S.n.mist===0?'Die Strophen sitzen. Der Reim trägt. Es ist, als hätte das Lied nur darauf gewartet, gesungen zu werden.':S.n.mist===1?'Ein Reim hinkt ein wenig, aber der Saal verzeiht es. Man singt eben nicht auf Hochglanz, sondern zusammen.':'Die Reime holpern wie ein Karren auf Eis, aber das ist egal: Sie kommen von Herzen, und Herzen sind freiwillig.'}</p><p>Erst singt Brunhilde, dann Oma Trude, dann die Kinder vom Marktplatz. Der Bäcker. Der Schmied. Selbst der Schneemann draußen scheint zu wippen. ${f('songRisk')?'Es ist knapp. Ohne den Rückhalt, den du nicht hattest, könnte es kippen.':''}</p>`,
ch:()=>[{l:'Das Lied zu Ende singen',to:()=>(f('songRisk')&&S.n.mist>=2)?'end_bell':'end_song'}]},

end_song:{act:5,place:'end',end:'song',chap:'Epilog · Triumph',t:'Das Lied der ganzen Gemeinde',
text:()=>`<p>Das Lied wird lauter. Es füllt den Saal, die Kerzen, die Balken. Die Glocke antwortet: nicht mit Zwang, sondern mit einem klaren, freundlichen Ton. Dreihundert Jahre Gewohnheit lösen sich auf wie Zucker in heißem Glühwein. Gerlinde nimmt das Lied entgegen wie jemand, der nach Jahrhunderten zum ersten Mal Blumen bekommt.</p><p>Die drei gefangenen Stimmen steigen aus der Glocke. Kunibert, Wiltrud und Haddo singen den Refrain mit, ein einziges Mal, dann verklingen sie friedlich.</p>${knotFate()}${lorianFate()}<p>Lorian beginnt sofort mit einem zwanzigminütigen Lautensolo. Das Publikum verlangt eine Zugabe. Du bereust einen Teil deiner Entscheidung.</p><p><b>Das Winterfest ist gerettet. Gerlinde bleibt, freiwillig, und Frostwinkel hat zum ersten Mal ein Lied, das niemandem gehört außer allen.</b></p><p class="soup">Und die Suppe? Brunhilde hat einen Kessel für alle gekocht. Der Vorrat reichte nicht ganz, aber das hat diesmal niemanden gestört.</p>`},
end_free:{act:5,place:'end',end:'free',chap:'Epilog · Freiheit',t:'Ein Winter ohne Ketten',
text:()=>`<p>${has('Silberne Stimmgabel')?'Die Stimmgabel singt eine einzige, klare Note. Und Gerlinde, die dreihundert Jahre lang jede Note hören musste, die man ihr aufzwang, hört zum ersten Mal eine, die sie sich aussuchen darf.':'Du reichst dem Licht in der Glocke die Hand, und das Licht nimmt an.'} Das Metall wird still, dann weich, dann … Schnee. Gewöhnlicher, unmagischer, feuchter Schnee.</p><p>Die Wärme des Dorfes fällt aus. Frostwinkel friert eine Nacht lang. Dann baut Brunhilde ein Feuer auf dem Marktplatz, und alle bringen mit, was sie haben: Holz, Decken, Lieder. Die drei Stimmen, die Gerlinde festhielt, steigen als Akkord in den Himmel und verstummen nicht traurig, sondern fertig.</p>${knotFate()}${lorianFate()}<p><b>Du hast Gerlinde befreit. Das Dorf muss jetzt selbst für Wärme sorgen und stellt fest, dass es das kann.</b></p><p class="soup">Und die Suppe? Brunhilde spendiert sie. Kostenlos. Der Vorrat reichte nicht, aber das war plötzlich allen egal.</p>`},
end_pact:{act:5,place:'end',end:'pact',chap:'Epilog · Kompromiss',t:'Der neue Pakt',
text:()=>`<p>Du schlägst Gerlinde einen neuen Vertrag vor: ohne Opfer, ohne Zwang, mit Betriebsrat. Gerlinde hört zu wie jemand, der seit dreihundert Jahren auf genau diesen Satz gewartet hat. Neue Bedingungen: ein Monat Urlaub im Jahr (den Dezember behält sie, sie verhandelt hart), das Recht auf Stille und eine garantierte Obergrenze von drei Weihnachtsliedern pro Abend. In Dur.</p><p>Die drei gefangenen Stimmen werden freigelassen und singen einen letzten Akkord, der Gänsehaut macht und ein bisschen nach Dankbarkeit klingt.</p>${knotFate()}${lorianFate()}<p><b>Du hast bewiesen, dass sogar uralte Magie vernünftige Arbeitsbedingungen verdient.</b></p><p class="soup">Und die Suppe? Gerlinde bekommt jetzt auch einen Gutschein. „Solange der Vorrat reicht“, sagt sie. „Ich erkläre ihn zum unerschöpflichen Vorrat.“ Das ist rechtlich bindend.</p>`},
end_hero:{act:5,place:'end',end:'hero',chap:'Epilog · Opfer',t:'Die letzte Zeile des Barden',
text:()=>`<p>Lorian steigt die Stufen zur Glocke hinauf, die Laute auf dem Rücken. Dann dreht er sich um. „Ich wollte nie für eine Glocke sterben“, sagt er laut, damit alle es hören. „Aber für Leute, die mir einen Platz im Tannenbaum frei halten? Vielleicht.“</p><p>Er singt. Es ist die beste Ballade seines Lebens, und sie hat nur eine Strophe. Gerlinde nimmt sie entgegen, freiwillig gegeben, wirklich freiwillig, und etwas in ihr zerbricht. Der Vertrag zerreißt von selbst. Die drei alten Stimmen steigen aus der Glocke, und im letzten Akkord klingt auch Lorians Stimme mit, sauber und klar, kein bisschen wie eine Waschmaschine.</p><p>Dann ist die Halle still. Das Dorf weint, summt, schweigt, und schließlich fängt Oma Trude auf ihrem Akkordeon die einzige Strophe an. Alle singen sie. Jedes Jahr wieder.</p>${knotFate()}<p><b>Der Hauptbarde ist zurückgekehrt, nur anders, als irgendjemand es wollte. Seine Ballade wird noch in hundert Jahren gesungen. Sie hat einen Reim, der nie ganz stimmt, und niemand wird ihn korrigieren.</b></p><p class="soup">Und die Suppe? Brunhilde stellt jeden Winter einen Teller auf Lorians Platz. Er bleibt immer leer, und das ist der Beweis, dass er trotzdem kommt.</p>`},
end_voice:{act:5,place:'end',end:'voice',chap:'Epilog · Selbstlosigkeit',t:'Das letzte Wort heißt Suppe',
text:()=>`<p>„Nimm meine“, sagst du. Es ist das Leiseste, was du je gesagt hast, und das Lauteste. Gerlinde schweigt lange. „Wirklich freiwillig?“, fragt sie. „Wirklich“, sagst du. Und da ist etwas in ihrem Licht, das du noch nie gesehen hast: Staunen.</p><p>Sie nimmt deine Stimme sanft wie einen Schneeball. Die Bindung reißt. Die drei alten Stimmen steigen aus der Glocke, Kunibert, Wiltrud, Haddo, und einer von ihnen sagt: „Das war … nett.“</p>${knotFate()}<p>Du kannst nicht mehr sprechen. Aber Brunhilde hat ein Notizbuch für dich, Lorian schreibt eine Ballade mit einundvierzig Strophen (du kannst nicht widersprechen), und das einzige Wort, das du noch flüstern kannst, ist: „Suppe.“</p><p><b>Du hast eine Stimme gegeben, damit vier andere weitersingen. Und du lernst, dass man mit einem Wort erstaunlich viel sagen kann. Zum Beispiel: „Suppe?“ Oder: „Suppe!“</b></p><p class="soup">Und die Suppe? Wird dir jetzt täglich gebracht. Von Leuten, die sich bedanken wollen, ohne zu wissen, wie.</p>`},
end_law:{act:5,place:'end',end:'law',chap:'Epilog · Gerechtigkeit',t:'Die Bürokratie schlägt zurück',
text:()=>`<p>${has('Amtsstempel')?'Du stempelst „AUFGEHOBEN“ über den Vertrag. Die Tinte leuchtet kurz auf, wie ein erleichtertes Feuerwerk.':'Hauptmann Krätze tritt vor, reibt den Stock an seiner Uniform blank und erklärt den Vertrag kraft seines Amtes für nichtig.'} Die Glocke zuckt, scheint zu zögern … und akzeptiert. Es ist ein Formular. Magie gehorcht Formularen, wenn sie richtig gestempelt sind.</p><p>Gerlinde ist frei, offiziell. Sie bekommt einen Dienstausweis und einen Parkplatz. Die drei Stimmen werden vorschriftsgemäß entlassen: mit Zeugnis und einer kurzen Dankesrede.</p>${knotFate()}${lorianFate()}<p>Hauptmann Krätze gründet die „Behörde für faire Magie“. Sie besteht weiterhin aus ihm und einem Stock.</p><p><b>Du hast das Dorf gerettet. Leider wurde dabei ein Formular erfunden.</b></p><p class="soup">Und die Suppe? Muss jetzt beantragt werden. Formular 27c/9. Bearbeitungszeit: bis Frühling.</p>`},
end_rogue:{act:5,place:'end',end:'rogue',chap:'Epilog · Schurkenherrschaft',t:'König der Formulare',
text:()=>`<p>Du stempelst dich zum obersten Festdirektor. Knöterich ist fassungslos. Die Glocke akzeptiert den neuen Vorgesetzten und verlangt sofort Urlaub. Du gewährst ihn und führst eine Steuer auf schlechte Reime ein. Lorian ist dein erster Schuldner.</p><p>Knöterich wird dein Buchhalter. Er findet es schrecklich und liebt es heimlich. Die Winterkrone schickt eine Mahnung, die du mit „GENEHMIGT: ZURÜCK AN ABSENDER“ beantwortest.</p>${lorianFate()}<p><b>Du hast das Fest gerettet und eine höchst zweifelhafte Karriere begonnen.</b></p><p class="soup">Und die Suppe? Ist jetzt gebührenpflichtig. Aber sehr gut.</p>`},
end_smash:{act:5,place:'end',end:'smash',chap:'Epilog · Chaos',t:'Scherben bringen Winter',
text:()=>`<p>Mit einem letzten Schlag zertrümmerst du die Glocke. Der Wintergeist entweicht als blauer Blitz durch das Dach. Die magische Wärme fällt aus, und Knöterich wird unter einem Berg Quittungen begraben, die plötzlich vom Dach rieseln.</p><p>Das Dorf friert eine Nacht lang. Am Morgen machen alle ein riesiges Lagerfeuer aus Festhallenbänken. Die drei gefangenen Stimmen steigen aus den Scherben und singen den Sonnenaufgang an.</p>${knotFate()}${lorianFate()}<p><b>Problem gelöst. Architektonisch fragwürdig, aber gelöst.</b></p><p class="soup">Und die Suppe? Brunhilde kocht sie auf dem Lagerfeuer. Kostenlos. Weil niemand mehr eine Kasse hat.</p>`},
end_greed:{act:5,place:'end',end:'greed',chap:'Epilog · Verrat',t:'Der Preis der Suppe',
text:()=>`<p>Du nimmst das Angebot an. Knöterich schüttelt dir die Hand, feucht und bürokratisch, und gibt ein Zeichen. Die Glocke läutet, und eine vierte Stimme verstummt: ${f('captured')?'Lorian, den du ihm bereits geliefert hast.':'Lorian, den Knöterichs Kobolde noch in dieser Nacht im Wald finden.'}</p><p>Das Dorf feiert. Es weiß nicht, wofür. Die Suppe ist ausgezeichnet. Doch jedes Mal, wenn du einen Löffel hebst, hörst du aus der Ferne vier Stimmen, die Akkorde singen, die es in keiner Tonleiter gibt. „War es das wert?“, fragen sie.</p><p><b>Du bist reich geworden. Ein Held bist du nicht.</b></p><p class="soup">Und die Suppe? Sie reichte für alle. Nur für dich nie.</p>`},
end_bell:{act:5,place:'end',end:'bell',chap:'Epilog · Tragödie',t:'Die vierte Stimme',
text:()=>`<p>Du zögerst, du hoffst, dass jemand anderes etwas tut. Niemand tut etwas. Gerlinde schwebt durch den Saal, ihr Licht wandert über die Gesichter, dann bleibt es stehen: bei Lorian. Er hat nicht einmal Zeit für einen letzten Reim. Die Glocke nimmt seine Stimme wie ein Stück Kuchen: bedauernd, aber gründlich.</p><p>Das Fest findet statt. Es ist ein ziemlich gutes Fest. Knöterich wird befördert. Aber im Akkord der Glocke singt jetzt eine vierte Stimme, und manchmal, nur manchmal, klingt sie wie eine Waschmaschine im Schleudergang.</p><p><b>Du hast das Dorf nicht gerettet. Du hast es nur beruhigt.</b></p><p class="soup">Und die Suppe? Sie reichte. Aber niemand hatte Hunger.</p>`}
});

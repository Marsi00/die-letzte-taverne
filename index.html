<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die letzte Taverne vor Weihnachten</title><style>
:root{--gold:#eac17d;--paper:#f4dfb5;--dark:#11121c;--panel:#1c2030;--muted:#a7a6b3}*{box-sizing:border-box}body{margin:0;background:#0b0c13;color:var(--paper);font:16px/1.6 Georgia,serif}button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:12px 4%;background:#10121b;border-bottom:1px solid #665137;position:sticky;top:0;z-index:3}header strong{font-size:15px;color:var(--gold);letter-spacing:.08em}header button,.tabs button{background:#242638;color:var(--paper);border:1px solid #756347;border-radius:8px;padding:7px 12px}.shell{max-width:980px;margin:auto;padding:20px 14px 55px}.hero{min-height:280px;border:1px solid #685536;border-radius:16px;background:radial-gradient(ellipse at 65% 55%,#a56c32 0%,#4d382c 20%,#202033 48%,#10121c 85%);display:flex;flex-direction:column;justify-content:flex-end;padding:26px;box-shadow:inset 0 -80px 90px #11121caa}.hero[data-place="village"]{background:radial-gradient(ellipse at 70% 20%,#8aa9ba,#37495c 30%,#171e2b 65%,#10121c)}.hero[data-place="crypt"]{background:radial-gradient(ellipse at 50% 70%,#518e7c,#253d40 35%,#10141d 80%)}.hero[data-place="stage"]{background:radial-gradient(ellipse at 50% 45%,#a34e65,#4a2b46 35%,#151522 80%)}.hero[data-place="forest"]{background:radial-gradient(ellipse at 40% 40%,#577258,#263e3b 35%,#111722 80%)}.hero h1{font-size:clamp(27px,5vw,46px);line-height:1.12;margin:0;color:#ffe4a9;text-shadow:0 3px 10px #000}.hero small{letter-spacing:.18em;text-transform:uppercase;color:#f2d4a0}.layout{display:grid;grid-template-columns:1fr 245px;gap:18px;margin-top:18px}.story,.side{background:var(--panel);border:1px solid #5c4c3a;border-radius:12px;padding:22px}.story p{margin:0 0 15px}.choices{display:grid;gap:10px;margin-top:20px}.choices button,.action{width:100%;text-align:left;border:1px solid #88704c;border-radius:9px;background:linear-gradient(110deg,#343040,#252739);color:#fbe4ba;padding:12px 16px}.choices button:hover,.action:hover{background:#594534}.choices button:disabled{opacity:.4;cursor:not-allowed}.side h3{margin:0 0 8px;color:var(--gold);font-size:17px}.side p,.side li{font:14px/1.5 system-ui,sans-serif;color:#d0cbd0}.side ul{padding-left:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{font:13px system-ui}.badge{color:#e5b972;font:12px system-ui;letter-spacing:.1em}.modal{position:fixed;inset:0;background:#080910ed;z-index:5;display:grid;place-items:center;padding:15px}.modal>div{max-width:570px;width:100%;background:#202336;border:1px solid #d3a96b;padding:24px;border-radius:14px}.modal h2{color:#edc98e}.modal button{margin:6px;padding:12px 15px;background:#3a3241;color:#fbe4ba;border:1px solid #c09c68;border-radius:8px}.hidden{display:none}.foot{font:12px system-ui;color:#9c9aa7;text-align:center;margin-top:24px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero{min-height:220px}.story{padding:17px}.side{padding:15px}}
</style></head><body><header><strong>⚔ DIE LETZTE TAVERNE</strong><div><button id="journalBtn">📜 Journal</button> <button id="restartBtn">↺</button></div></header><main class="shell"><section class="hero" id="hero"><small id="chapter"></small><h1 id="heading"></h1></section><div class="layout"><section class="story"><div class="badge" id="status"></div><div id="prose"></div><div class="choices" id="choices"></div></section><aside class="side"><h3>🎒 Inventar</h3><ul id="inventory"></ul><h3>🧭 Quest</h3><p id="quest"></p><h3>🎲 Charakter</h3><p id="character"></p></aside></div><p class="foot">Ein eigenständiges, offline spielbares Fantasy-Abenteuer. Alle Handlungswege sind vorab geschrieben.</p></main><div class="modal hidden" id="modal"><div><h2 id="modalTitle"></h2><div id="modalText"></div><div id="modalActions"></div></div></div><script>
const S={node:'intro',cls:null,items:[],flags:{},visited:[],ending:null};const saved=localStorage.getItem('taverne_v2');if(saved){try{Object.assign(S,JSON.parse(saved))}catch(e){}}const $=id=>document.getElementById(id);function has(i){return S.items.includes(i)}function add(i){if(!has(i))S.items.push(i)}function flag(k){return !!S.flags[k]}function save(){localStorage.setItem('taverne_v2',JSON.stringify(S))}function go(n){S.node=n;if(!S.visited.includes(n))S.visited.push(n);save();render()}function choose(t){if(t.effect)t.effect();go(t.to)}function opts(a){return a.filter(x=>!x.if||x.if()).map(x=>({label:x.label,to:x.to,effect:x.effect}))}
const N={
intro:{title:'Die letzte Taverne vor Weihnachten',place:'tavern',chapter:'Prolog · Eine Nacht vor dem Fest',text:()=>`<p>In Frostwinkel wird morgen das Winterfest gefeiert. Zum ersten Mal seit 300 Jahren ist jedoch der Hauptbarde verschwunden. Das wäre normalerweise kein Drama — die letzten drei Hauptbarden waren auch verschwunden, allerdings jeweils unter einem Tisch.</p><p>Doch diesmal schweigt die magische Festglocke. Auf dem Marktplatz hängt ein Zettel: <em>„Wer den Barden findet, erhält 100 Goldstücke und einen Gutschein für Suppe.“</em> Darunter hat jemand „Suppe nur solange Vorrat reicht“ geschrieben.</p><p>Du stehst vor der Taverne Zum Letzten Würfel. Eine Entscheidung liegt vor dir.</p>`,choices:()=>[{label:'Als Barde beginnen — Charisma und ein zweifelhafter Reim',to:'arrival',effect:()=>S.cls='Barde'},{label:'Als Schurke beginnen — Schlösser, Schatten und schlechte Absichten',to:'arrival',effect:()=>S.cls='Schurke'},{label:'Als Barbar beginnen — Probleme sind Türen, die man öffnen kann',to:'arrival',effect:()=>S.cls='Barbar'}]},
arrival:{title:'Zum Letzten Würfel',place:'tavern',chapter:'Akt I · Die falsche Fährte',text:()=>`<p>Die Taverne riecht nach Bratäpfeln, nassem Fell und einer Entscheidung, die jemand später bereuen wird. Hinter der Theke steht Wirtin Brunhilde. Ein Goblin in einer zu großen Offiziersuniform bewacht einen Käfig voller leerer Bierkrüge.</p><p>„Wenn du wegen des Barden hier bist“, sagt Brunhilde, „war er nie hier.“ Dabei schiebt sie demonstrativ einen Hut mit der Aufschrift <em>HAUPTBARDE</em> unter die Theke.</p><p>Du kannst den Raum frei untersuchen. Manche Hinweise eröffnen neue Wege.</p>`,choices:()=>opts([{label:'Brunhilde befragen',to:'brunhilde'},{label:'Den Goblin ansprechen',to:'goblin'},{label:'Den auffälligen Hut untersuchen',to:'hat'},{label:'Zum Marktplatz gehen',to:'village'},{label:'Den Keller betreten',to:'cellar',if:()=>flag('cellar')||has('Kellerschlüssel')},{label:'Den Spuren in den Wald folgen',to:'forest',if:()=>flag('forest')},{label:'Zurück zur großen Halle',to:'hall',if:()=>flag('hall')}])},
brunhilde:{title:'Brunhildes Geschichte',place:'tavern',chapter:'Akt I · Befragung',text:()=>`<p>Brunhilde poliert ein Glas, das seit Jahren nicht sauberer geworden ist. „Er wollte die Glocke nicht mehr läuten lassen. Hat irgendwas von einem Vertrag gesagt. Dann kam der Steuereintreiber.“</p><p>Als du nach dem Vertrag fragst, wird sie still. „Unter der Taverne liegt ein alter Archivkeller. Ich habe den Schlüssel verloren. Vermutlich in meiner Tasche.“</p>`,choices:()=>[{label:'Sie höflich um den Schlüssel bitten',to:'key',effect:()=>add('Kellerschlüssel')},{label:'Sie nach dem Steuereintreiber fragen',to:'tax'},{label:'Zur Schankstube zurück',to:'arrival'}]},
key:{title:'Ein überraschend ehrlicher Handel',place:'tavern',chapter:'Akt I · Fundstück',text:()=>`<p>Brunhilde betrachtet dich lange. „Du willst da wirklich runter? Dann nimm ihn. Und falls du stirbst, sag den Geistern, dass sie ihre Rechnungen begleichen sollen.“</p><p><strong>Erhalten: Kellerschlüssel.</strong></p>`,choices:()=>[{label:'In den Keller',to:'cellar'},{label:'Zur Schankstube',to:'arrival'}]},
tax:{title:'Der Mann mit dem Stempel',place:'tavern',chapter:'Akt I · Verdacht',text:()=>`<p>„Herr Knöterich“, sagt Brunhilde. „Eintreiber im Namen der Winterkrone. Seit Jahren behauptet er, dass jede gesungene Note steuerpflichtig sei. Ich halte das für Betrug. Vor allem, weil er selbst nur zwei Noten kennt.“</p><p>Sie deutet auf Fußspuren, die aus der Hintertür in den Tannenwald führen.</p>`,choices:()=>[{label:'Spuren merken und in den Wald gehen',to:'forest',effect:()=>S.flags.forest=true},{label:'Zur Schankstube',to:'arrival',effect:()=>S.flags.forest=true}]},
goblin:{title:'Hauptmann Krätze',place:'tavern',chapter:'Akt I · Ein verdächtiger Verbündeter',text:()=>`<p>„Ich bin Hauptmann Krätze, Leiter der königlichen Antidiebstahlbehörde!“, verkündet der Goblin. „Das ist mein erster Tag. Und meine Behörde besteht aus mir und diesem Stock.“</p><p>Er besitzt eine zerknitterte Karte des Ortes. Er tauscht sie gegen einen überzeugenden Grund, warum du kein Spion bist.</p>`,choices:()=>[{label:'„Ich bin ein staatlich geprüfter Nicht-Spion.“',to:'map',effect:()=>add('Dorfkarte')},{label:'„Ich bin selbst Spion, aber für die Guten.“',to:'goblinfail'},{label:'Zur Schankstube',to:'arrival'}]},
goblinfail:{title:'Ein Missverständnis',place:'tavern',chapter:'Akt I · Konsequenz',text:()=>`<p>Krätze bläst in eine Trillerpfeife. Nichts passiert. Er bläst noch einmal. „Ich habe keine Verstärkung“, gesteht er. „Aber ich habe Prinzipien!“</p><p>Du erhältst keine Karte. Immerhin hält er dich jetzt für einen sehr schlechten Spion.</p>`,choices:()=>[{label:'Noch einmal mit Krätze reden',to:'goblin'},{label:'Zur Schankstube',to:'arrival'}]},
map:{title:'Eine Karte, fast maßstabsgetreu',place:'tavern',chapter:'Akt I · Fundstück',text:()=>`<p>Die Karte zeigt Frostwinkel, den Wald und die verfallene Festhalle. Ein Pfeil mit der Beschriftung „GEHEIM“ zeigt auf die Festhalle. Daneben steht „Bitte nicht weitersagen“.</p><p><strong>Erhalten: Dorfkarte.</strong> Die Festhalle ist nun erreichbar.</p>`,choices:()=>[{label:'Zur Festhalle',to:'hall',effect:()=>S.flags.hall=true},{label:'Zur Schankstube',to:'arrival',effect:()=>S.flags.hall=true}]},
hat:{title:'Der Hut des Hauptbarden',place:'tavern',chapter:'Akt I · Beweisstück',text:()=>`<p>Im Hut steckt ein zusammengefalteter Zettel: <em>„Ich bin nicht entführt worden. Wer den Vertrag findet, wird verstehen, warum ich mich verstecke. Vertraut nicht der Glocke.“</em></p><p>Auf der Rückseite steht eine seltsame Folge: <strong>3 – 1 – 4 – 2</strong>. Vielleicht die Reihenfolge für etwas im Archiv?</p>`,choices:()=>[{label:'Zettel einstecken',to:'arrival',effect:()=>add('Notiz des Barden')}]},
cellar:{title:'Das Archiv unter der Schankstube',place:'crypt',chapter:'Akt II · Der alte Vertrag',text:()=>`<p>Im Keller flackern grüne Kerzen, obwohl niemand sie angezündet hat. Ein steinerner Schrank trägt vier Symbole: Krone, Laute, Glocke, Münze. Darunter sind vier drehbare Scheiben mit Zahlen.</p><p>Ein Schild warnt: <em>„Falsche Reihenfolge aktiviert die automatische Belehrung über Archivrecht.“</em></p>`,choices:()=>[{label:'Die Zahlenfolge 3 – 1 – 4 – 2 einstellen',to:'archive',if:()=>has('Notiz des Barden')},{label:'Die Reihenfolge 1 – 2 – 3 – 4 ausprobieren',to:'lecture'},{label:'Die Scheiben gewaltsam entfernen',to:'force',if:()=>S.cls==='Barbar'},{label:'Zur Schankstube',to:'arrival'}]},
lecture:{title:'Die Strafe des Archivs',place:'crypt',chapter:'Akt II · Fehlschlag',text:()=>`<p>Eine geisterhafte Stimme liest dir zwölf Seiten über die ordnungsgemäße Lagerung von Pergament vor. Nach sieben Minuten verlierst du den Lebenswillen, aber keine Lebenspunkte.</p><p>Der Mechanismus setzt sich zurück. Vielleicht gibt es einen Hinweis auf die richtige Reihenfolge.</p>`,choices:()=>[{label:'Erneut versuchen',to:'cellar'},{label:'Nach einem Hinweis suchen',to:'arrival'}]},
force:{title:'Barbarische Archivwissenschaft',place:'crypt',chapter:'Akt II · Alternative Lösung',text:()=>`<p>Du schlägst den Schrank so fest, dass der Mechanismus aus Angst aufspringt. Eine geisterhafte Stimme seufzt: „Das ist gegen die Hausordnung.“</p>`,choices:()=>[{label:'Den Vertrag lesen',to:'archive'}]},
archive:{title:'Das Kleingedruckte',place:'crypt',chapter:'Akt II · Die Wahrheit',text:()=>`<p>Im Schrank liegt ein Vertrag, unterzeichnet vor 300 Jahren: Die Winterglocke schenkt Frostwinkel Wärme und Glück. Im Gegenzug gehört ihr jedes Jahr <strong>eine freiwillig dargebotene Stimme</strong>.</p><p>Auf der letzten Seite hat Knöterich handschriftlich „freiwillig“ durchgestrichen. Der Barde wollte die Opferung stoppen. Knöterich will den Vertrag trotzdem durchsetzen, weil er die Glocke für seine Karriere braucht.</p><p>Die Dorfbewohner wissen nichts davon. Du hast jetzt einen Beweis.</p>`,choices:()=>[{label:'Den Vertrag mitnehmen und zur Festhalle gehen',to:'hall',effect:()=>{add('Originalvertrag');S.flags.hall=true}},{label:'Brunhilde konfrontieren',to:'confront',effect:()=>add('Originalvertrag')}]},
confront:{title:'Brunhildes Schuld',place:'tavern',chapter:'Akt II · Eine unbequeme Wahrheit',text:()=>`<p>Brunhilde lässt das Glas fallen. „Ich wusste, dass die Glocke etwas nimmt. Ich dachte, es sei nur die Erinnerung an ein Lied. Meine Mutter hat mir gesagt, ich solle nie nachfragen.“</p><p>Sie überreicht dir eine kleine Stimmgabel. „Sie kann den Bann brechen. Aber vielleicht auch die Wärme des Dorfes.“</p>`,choices:()=>[{label:'Stimmgabel nehmen und zur Festhalle',to:'hall',effect:()=>{add('Silberne Stimmgabel');S.flags.hall=true}}]},
village:{title:'Der Marktplatz von Frostwinkel',place:'village',chapter:'Akt I · Spuren im Schnee',text:()=>`<p>Ein Schneemann trägt ein Schild: „Der Barde schuldet mir fünf Goldstücke.“ Kinder verkaufen Lebkuchen in Form von Drachen, die verdächtig nach Kartoffeln aussehen.</p><p>Eine alte Musikerin erzählt, der Barde habe sich in der Festhalle mit Knöterich gestritten. Danach sei er in den Wald geflohen.</p>`,choices:()=>[{label:'Der Spur zur Festhalle folgen',to:'hall',effect:()=>S.flags.hall=true},{label:'Dem Waldweg folgen',to:'forest',effect:()=>S.flags.forest=true},{label:'Zur Taverne zurück',to:'arrival'}]},
forest:{title:'Der Wald der verlorenen Refrains',place:'forest',chapter:'Akt II · Begegnung',text:()=>`<p>Zwischen den Tannen sitzt eine vermummte Gestalt und spielt auf einer Laute. Die Melodie klingt wie eine Mischung aus Heldensage und dem Geräusch einer kaputten Waschmaschine.</p><p>„Wenn du mich zurückbringen willst, verschwinde“, sagt der Barde. „Ich werde nicht für eine Glocke sterben, damit das Dorf kostenlos Glühwein trinken kann.“</p>`,choices:()=>[{label:'Ihm vom Vertrag erzählen',to:'bardtruth',if:()=>has('Originalvertrag')},{label:'Ihn überzeugen, dass du helfen willst',to:'bardtrust'},{label:'Ihn bedrohen, damit er zurückkommt',to:'bardanger'},{label:'Zur Taverne zurück',to:'arrival'}]},
bardtrust:{title:'Eine schwierige Allianz',place:'forest',chapter:'Akt II · Verbündeter',text:()=>`<p>Der Barde stellt sich als Lorian vor. „Dann hilf mir, die Glocke zu stoppen. Knöterich wird morgen alle zum Singen zwingen.“ Er gibt dir einen alten Ring, der die Festhalle öffnen kann.</p><p>„Und wenn du mich verrätst, schreibe ich eine Ballade über dich. Eine wirklich schlechte.“</p>`,choices:()=>[{label:'Ring nehmen und zur Festhalle',to:'hall',effect:()=>{add('Ring des Barden');S.flags.bard=true;S.flags.hall=true}},{label:'Erst den Vertrag suchen',to:'arrival',effect:()=>{add('Ring des Barden');S.flags.bard=true}}]},
bardtruth:{title:'Das Lied der Freiheit',place:'forest',chapter:'Akt II · Verbündeter',text:()=>`<p>Lorian liest die Änderungen im Vertrag und wird bleich. „Ich wusste, dass etwas faul ist. Aber das ist nicht nur Betrug. Die Glocke selbst ist gefangen. Sie war einst ein Wintergeist, den man in Metall eingeschlossen hat.“</p><p>Er gibt dir seinen Ring. „Wenn wir sie befreien, könnte die Magie verschwinden. Vielleicht finden wir einen anderen Weg.“</p>`,choices:()=>[{label:'Gemeinsam zur Festhalle',to:'hall',effect:()=>{add('Ring des Barden');S.flags.bard=true;S.flags.spirit=true;S.flags.hall=true}}]},
bardanger:{title:'Eine sehr schlechte Idee',place:'forest',chapter:'Akt II · Konsequenz',text:()=>`<p>Lorian wirft eine Handvoll Glitzerpulver. Du niest so laut, dass drei Eichhörnchen die Gewerkschaft gründen. Als du wieder sehen kannst, ist er weg.</p><p>Du kannst die Festhalle trotzdem erreichen, aber der Barde wird dir nicht helfen.</p>`,choices:()=>[{label:'Zur Festhalle',to:'hall',effect:()=>{S.flags.hall=true;S.flags.bardhostile=true}},{label:'Zur Taverne',to:'arrival'}]},
hall:{title:'Die verlassene Festhalle',place:'stage',chapter:'Akt III · Das letzte Konzert',text:()=>`<p>Die Festhalle ist voller Banner, die „FREIWILLIGE TEILNAHME PFLICHT“ verkünden. Auf der Bühne steht Herr Knöterich in einer Robe aus Quittungen. Über ihm schwebt die stumme Winterglocke.</p><p>„Willkommen zur jährlichen Stimmbesteuerung!“, ruft er. „Wer nicht singt, zahlt eine Bearbeitungsgebühr.“</p><p>${has('Originalvertrag')?'Du hast den Originalvertrag bei dir.':'Du hast noch keinen schriftlichen Beweis für den Betrug.'} ${flag('bard')?'Lorian beobachtet dich aus dem Schatten der Bühne.':'Vom Barden fehlt jede Spur.'}</p>`,choices:()=>opts([{label:'Knöterich mit dem Originalvertrag konfrontieren',to:'trial',if:()=>has('Originalvertrag')},{label:'Die Glocke mit der Stimmgabel befreien',to:'free',if:()=>has('Silberne Stimmgabel')},{label:'Mit Lorian ein Gegenlied anstimmen',to:'song',if:()=>flag('bard')},{label:'Die Glocke zerstören',to:'smash',if:()=>S.cls==='Barbar'},{label:'Knöterichs Stempel stehlen',to:'steal',if:()=>S.cls==='Schurke'},{label:'Knöterichs Angebot anhören',to:'offer'},{label:'Noch einmal nach Hinweisen suchen',to:'arrival'}])},
trial:{title:'Der Prozess des Jahrhunderts',place:'stage',chapter:'Finale · Das Gesetz spricht',text:()=>`<p>Du liest den Vertrag laut vor. Die Menge murmelt. Knöterich wird rot und behauptet, die Streichung von „freiwillig“ sei ein „redaktioneller Fehler“.</p><p>Krätze, der inzwischen eingetroffen ist, ruft: „Ich bin die Behörde! Und ich kann lesen! Langsam, aber ich kann!“</p><p>Die Glocke beginnt zu leuchten. Die Dorfbewohner verlangen eine Entscheidung.</p>`,choices:()=>[{label:'Den Vertrag öffentlich für ungültig erklären',to:'end_free'},{label:'Den Vertrag neu verhandeln',to:'end_pact'},{label:'Knöterich an die Goblin-Behörde ausliefern',to:'end_law'}]},
free:{title:'Die Stimme im Metall',place:'stage',chapter:'Finale · Ein riskanter Versuch',text:()=>`<p>Die Stimmgabel singt eine klare Note. Aus der Glocke spricht eine müde Stimme: „Dreihundert Jahre lang musste ich Weihnachtslieder hören. Wisst ihr, wie viele davon in Moll sind?“</p><p>Der Wintergeist bittet dich, ihn zu befreien. Doch ohne ihn könnte das Dorf seine magische Wärme verlieren.</p>`,choices:()=>[{label:'Den Geist befreien, koste es, was es wolle',to:'end_free'},{label:'Ihm eine freiwillige Partnerschaft anbieten',to:'end_pact'}]},
song:{title:'Die schrecklichste Ballade der Welt',place:'stage',chapter:'Finale · Musik gegen Bürokratie',text:()=>`<p>Lorian springt auf die Bühne. Du begleitest ihn. Eure improvisierte Ballade handelt von Mut, Freiheit und einer Steuererklärung, die niemals eingereicht wurde.</p><p>Die Menge singt mit. Knöterich versucht, die Musik als gewerbliche Veranstaltung anzumelden, doch seine Stempel zerbrechen.</p>`,choices:()=>[{label:'Die Glocke durch das Lied erlösen',to:'end_music'},{label:'Knöterich zu einem Gesangsduell herausfordern',to:'end_duel'}]},
smash:{title:'Eine sehr direkte Verhandlung',place:'stage',chapter:'Finale · Barbarische Diplomatie',text:()=>`<p>Du greifst einen schweren Stuhl und schlägst auf die Glocke. Ein Riss erscheint. Darin glimmt ein kleines, erschrockenes Licht.</p><p>Knöterich kreischt: „Sachbeschädigung an einer amtlichen Klangvorrichtung!“</p>`,choices:()=>[{label:'Noch einmal zuschlagen',to:'end_smash'},{label:'Dem Licht die Freiheit anbieten',to:'end_free'}]},
steal:{title:'Die Macht des Stempels',place:'stage',chapter:'Finale · Schurkische Buchhaltung',text:()=>`<p>Mit einer eleganten Bewegung stiehlst du Knöterichs Amtsstempel. Darauf steht: „GENEHMIGT“. Du hältst ihn über den Vertrag. Selbst die Glocke scheint auf eine offizielle Bestätigung zu warten.</p>`,choices:()=>[{label:'„Vertrag aufgehoben“ abstempeln',to:'end_law'},{label:'Dich selbst zum Festdirektor ernennen',to:'end_rogue'}]},
offer:{title:'Ein unmoralisches Angebot',place:'stage',chapter:'Finale · Die Versuchung',text:()=>`<p>Knöterich beugt sich zu dir. „Hilf mir, den Barden zu finden, und du erhältst 500 Goldstücke, einen lebenslangen Suppengutschein und einen Titel. Etwa: Oberster Festbeauftragter.“</p><p>Hinter ihm flackert die Glocke schwach, als würde sie um Hilfe bitten.</p>`,choices:()=>[{label:'Das Angebot annehmen',to:'end_greed'},{label:'Ablehnen und zurück zur Festhalle',to:'hall'}]},
end_free:{title:'Ende: Ein Winter ohne Ketten',place:'village',chapter:'Epilog · Freiheit',ending:true,text:()=>`<p>Du zerreißt den Vertrag und befreist den Wintergeist. Zum ersten Mal seit Jahrhunderten fällt gewöhnlicher, unmagischer Schnee auf Frostwinkel.</p><p>Die Dorfbewohner müssen ihre Häuser selbst heizen. Sie sind zunächst empört. Dann stellen sie fest, dass man auch ohne Opfergabe feiern kann.</p><p>Lorian schreibt eine Ballade über dich. Sie hat siebzehn Strophen. Du bittest ihn, vierzehn zu streichen.</p><p><strong>Du hast das Dorf befreit. Und Weihnachten gerettet — ganz ohne Zwangsopfer.</strong></p>`},
end_pact:{title:'Ende: Der neue Pakt',place:'village',chapter:'Epilog · Kompromiss',ending:true,text:()=>`<p>Du schlägst einen neuen Vertrag vor: Der Wintergeist bleibt freiwillig und erhält jedes Jahr einen Monat Urlaub, das Recht auf Stille und eine garantierte Obergrenze von drei Weihnachtsliedern.</p><p>Die Glocke stimmt zu. Frostwinkel behält seine Wärme, Lorian seine Stimme und Knöterich verliert seine Lizenz.</p><p><strong>Du hast bewiesen, dass sogar uralte Magie vernünftige Arbeitsbedingungen verdient.</strong></p>`},
end_law:{title:'Ende: Die Bürokratie schlägt zurück',place:'stage',chapter:'Epilog · Gerechtigkeit',ending:true,text:()=>`<p>Hauptmann Krätze erklärt den Vertrag für ungültig und nimmt Knöterich fest. Der protestiert, bis Krätze ihn wegen unerlaubten Protestierens zusätzlich verwarnt.</p><p>Die Glocke verstummt friedlich. Krätze gründet eine neue Behörde für faire Magie. Sie besteht weiterhin aus ihm und einem Stock.</p><p><strong>Du hast das Dorf gerettet. Leider wurde dabei ein Formular erfunden.</strong></p>`},
end_music:{title:'Ende: Die Ballade der Befreiung',place:'stage',chapter:'Epilog · Triumph',ending:true,text:()=>`<p>Euer Lied wird so laut, dass die alten Runen zerbrechen. Die Glocke gibt die gefangenen Stimmen frei. Hunderte Melodien wirbeln durch den Saal.</p><p>Das Publikum verlangt eine Zugabe. Lorian beginnt sofort mit einem zwanzigminütigen Lautensolo. Du bereust einen Teil deiner Entscheidung.</p><p><strong>Das Winterfest ist gerettet — und du bist Teil einer legendären Band.</strong></p>`},
end_duel:{title:'Ende: Knöterich unplugged',place:'stage',chapter:'Epilog · Das Duell',ending:true,text:()=>`<p>Knöterich nimmt die Herausforderung an. Sein Lied besteht ausschließlich aus dem Wort „Gebührenordnung“. Nach der dritten Wiederholung flieht das Publikum.</p><p>Die Glocke entscheidet, dass dies eine grausame und ungewöhnliche Bestrafung sei, und befreit sich selbst. Knöterich erhält lebenslanges Auftrittsverbot.</p><p><strong>Du hast gewonnen. Die Musikgeschichte wird dir danken.</strong></p>`},
end_smash:{title:'Ende: Scherben bringen Winter',place:'village',chapter:'Epilog · Chaos',ending:true,text:()=>`<p>Mit einem letzten Schlag zertrümmerst du die Glocke. Der Wintergeist entkommt, die magische Heizung fällt aus, und Knöterich wird unter einem Berg Quittungen begraben.</p><p>Das Dorf friert eine Nacht lang. Am Morgen machen alle ein riesiges Lagerfeuer. Brunhilde spendiert Suppe — tatsächlich kostenlos.</p><p><strong>Problem gelöst. Architektonisch fragwürdig, aber gelöst.</strong></p>`},
end_rogue:{title:'Ende: König der Formulare',place:'stage',chapter:'Epilog · Schurkenherrschaft',ending:true,text:()=>`<p>Du stempelst dich zum obersten Festdirektor. Knöterich ist fassungslos. Die Glocke akzeptiert den neuen Vorgesetzten und verlangt sofort Urlaub.</p><p>Du gewährst ihn und führst eine Steuer auf schlechte Reime ein. Lorian ist dein erster Schuldner.</p><p><strong>Du hast das Fest gerettet und eine höchst zweifelhafte Karriere begonnen.</strong></p>`},
end_greed:{title:'Ende: Der Preis der Suppe',place:'stage',chapter:'Epilog · Verrat',ending:true,text:()=>`<p>Du nimmst das Gold. Knöterich behält die Macht, die Glocke fordert weiter Stimmen, und Lorian verschwindet endgültig.</p><p>Die Suppe ist immerhin ausgezeichnet. Doch jedes Mal, wenn du einen Löffel hebst, hörst du die Glocke flüstern: „War es das wert?“</p><p><strong>Du bist reich geworden. Ein Held bist du nicht.</strong></p>`}
};
function render(){let n=N[S.node]||N.intro;$('hero').dataset.place=n.place;$('chapter').textContent=n.chapter;$('heading').textContent=n.title;$('status').textContent=n.ending?'ABENTEUER BEENDET':`GESPIELTE SZENEN: ${S.visited.length} · ${S.cls||'Charakterwahl'}`;$('prose').innerHTML=n.text();$('choices').innerHTML='';(n.choices?n.choices():[{label:'Ein neues Abenteuer beginnen',to:'intro',effect:reset}]).forEach(o=>{let b=document.createElement('button');b.textContent='➜ '+o.label;b.onclick=()=>choose(o);$('choices').appendChild(b)});$('inventory').innerHTML=(S.items.length?S.items:['Noch leer']).map(i=>'<li>'+i+'</li>').join('');$('quest').textContent=n.ending?'Dein Weg hat ein Ende gefunden. Du kannst eine andere Entscheidung ausprobieren.':has('Originalvertrag')?'Entscheide, was mit dem Vertrag und der Winterglocke geschehen soll.':flag('bard')?'Finde den Vertrag und stoppe die Zwangsopferung.':'Finde den verschwundenen Barden und das Geheimnis der Winterglocke.';$('character').textContent=S.cls||'Noch nicht gewählt'}function reset(){localStorage.removeItem('taverne_v2');Object.assign(S,{node:'intro',cls:null,items:[],flags:{},visited:[],ending:null})}function modal(title,html){$('modalTitle').textContent=title;$('modalText').innerHTML=html;$('modalActions').innerHTML='<button onclick="document.getElementById(\'modal\').classList.add(\'hidden\')">Schließen</button>';$('modal').classList.remove('hidden')}$('journalBtn').onclick=()=>modal('Abenteuerjournal',`<p><b>Dein Auftrag:</b> Den verschwundenen Hauptbarden finden und das Geheimnis der Winterglocke lüften.</p><p><b>Besuchte Orte/Szenen:</b> ${S.visited.length}</p><p><b>Hinweise:</b> ${[has('Notiz des Barden')?'Notiz: 3–1–4–2':'',has('Originalvertrag')?'Vertrag: Eine Stimme muss freiwillig sein':'',flag('spirit')?'Die Glocke beherbergt einen gefangenen Wintergeist':''].filter(Boolean).join('; ')||'Noch keine.'}</p>`);$('restartBtn').onclick=()=>{if(confirm('Wirklich neu beginnen? Der Spielstand wird gelöscht.')){reset();save();render()}};render();
</script></body></html>
